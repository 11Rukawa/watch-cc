name: CI

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Show environment
        run: python -c "import sys; print(sys.version, sys.platform)"

      - name: Smoke test - direct run --help
        run: python watch-cc.py --help

      - name: Smoke test - --list against fixture
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python watch-cc.py --projects ./tests/fixtures/projects --list

      - name: Smoke test - --all against fixture
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python watch-cc.py --projects ./tests/fixtures/projects test-sess --all --ascii

      - name: Smoke test - --grep and --tail against fixture
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python watch-cc.py --projects ./tests/fixtures/projects test-sess --all --grep "目录" --ascii
          python watch-cc.py --projects ./tests/fixtures/projects test-sess --tail 2 --ascii
          python watch-cc.py --projects ./tests/fixtures/projects test-sess --all --raw

      - name: Build check - install as a package
        run: |
          pip install --upgrade pip
          pip install .

      - name: Smoke test - installed entry point
        run: watch-cc --help
